<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="title desc"
>
  <title id="title">Echohub</title>
  <desc id="desc">A slim E whose arms trail into fading echo bars.</desc>

  <!-- Rose Pine base, square corners to match the app chrome. -->
  <rect width="512" height="512" fill="#191724" />

  <!-- The E: solid spine and three arms. -->
  <g fill="#ebbcba">
    <rect x="120" y="128" width="56" height="256" />
    <rect x="176" y="128" width="120" height="56" />
    <rect x="176" y="228" width="100" height="56" />
    <rect x="176" y="328" width="120" height="56" />
  </g>

  <!-- First echo of each arm: iris. -->
  <g fill="#c4a7e7" opacity="0.9">
    <rect x="312" y="128" width="24" height="56" />
    <rect x="292" y="228" width="20" height="56" />
    <rect x="312" y="328" width="24" height="56" />
  </g>

  <!-- Second echo: foam. -->
  <g fill="#9ccfd8" opacity="0.7">
    <rect x="352" y="128" width="16" height="56" />
    <rect x="328" y="228" width="14" height="56" />
    <rect x="352" y="328" width="16" height="56" />
  </g>

  <!-- Third echo, slimmest and faintest: gold. -->
  <g fill="#f6c177" opacity="0.6">
    <rect x="384" y="128" width="8" height="56" />
    <rect x="358" y="228" width="8" height="56" />
    <rect x="384" y="328" width="8" height="56" />
  </g>
</svg>
