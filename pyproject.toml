[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echohub"
version = "2.2.1"
description = "Local-first telemetry deck for Echopoint data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# Only the Essentials wheel: Qt Widgets/Gui/Core without WebEngine or add-ons.
dependencies = [
  "PySide6-Essentials>=6.8; python_version >= '3.12'",
  # 6.12.0 drops a reference to None on every call that returns nothing.
  # Python 3.12+ never frees None; 3.11 does, and crashes.
  "PySide6-Essentials>=6.8,<6.12; python_version < '3.12'",
]
authors = [{name = "Ujjwal Vivek"}]
keywords = ["echohub", "echopoint", "dashboard", "telemetry", "tui", "qt", "pyside6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]


[project.optional-dependencies]
dev = [
  "pytest>=8",
  "basedpyright>=1.31",
]

[project.scripts]
echohub = "echohub.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echohub = [
  "assets/*.png",
  "assets/*.ico",
  "assets/*.svg"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
# What `uv sync` installs for development. Keep in step with the `dev` extra
# above, which CI installs through pip.
dev = [
    "ruff>=0.16.4",
    "pytest>=8",
    "basedpyright>=1.31",
]
